:root[data-theme=dark]{--r-perp:#f08a70;--r-act:#5fc9d8;--r-afec:#f2c14e;color-scheme:dark;--paper:#18241e;--ink:#f0f1e6;--muted:#bcc7b9;--line:#526454;--focus:#ccebd4}:root[data-theme=dark] .chapter{--chapter-bg:var(--dark-bg);--chapter-ink:var(--dark-ink)}:root[data-theme=dark] .chapter .node-mark{background:var(--dim-bright)}:root[data-theme=dark] .mini-stat,:root[data-theme=dark] .intro-top>span{color:color-mix(in srgb,var(--chapter),white 45%)}

/* ── Stakeholders por categoría · el color de rol vive SÓLO en esta sección ── */
.role-legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin:0 0 30px;padding:16px 18px;border:1px solid var(--line);border-radius:14px}
.role-key{display:flex;align-items:center;gap:9px;font-size:.83rem}
.role-key i{width:13px;height:13px;border-radius:4px;background:var(--role);flex:none}
.role-key.dual-key i{background:linear-gradient(135deg,var(--r-perp) 0 50%,var(--r-act) 50% 100%)}
.role-key b{font-weight:650}
.role-key small{color:var(--muted)}
.role-chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
.role-chip{font:600 .7rem/1 var(--font);letter-spacing:.07em;text-transform:uppercase;padding:6px 11px;border-radius:999px;color:#fff;background:var(--role)}
.actor{position:relative;border-left:4px solid var(--role)}
.actor.is-dual{border-left-color:transparent}
.actor.is-dual::before{content:'';position:absolute;left:-4px;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--role) 0 50%,var(--role2) 50% 100%)}
.actor-cats{display:inline-block;font:600 .66rem/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--role);padding:5px 9px;border-radius:999px;margin-bottom:10px}
.dual-note{margin:14px 0 0;padding:13px 15px;border-radius:12px;border:1px dashed var(--line);font-size:.9rem;line-height:1.55}
.dual-note strong{font-weight:650}
/* ── Conectividad ── */
.conn-section{padding:88px 0 20px}
.conn-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:14px;margin:0 0 34px}
.conn-stats div{border:1px solid var(--line);border-radius:14px;padding:17px 16px}
.conn-stats strong{display:block;font:700 1.9rem/1 var(--display);letter-spacing:-.02em}
.conn-stats span{display:block;margin-top:5px;font-size:.79rem;color:var(--muted)}
.conn-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:38px;align-items:start}
.conn-grid h3{font:700 1.12rem/1.25 var(--display);margin:0 0 16px}
.conn-grid h3 small{font:500 .78rem/1 var(--font);color:var(--muted);margin-left:8px}
.rank-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rank-row{width:100%;display:flex;gap:13px;align-items:flex-start;text-align:left;background:none;border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;color:inherit;font:inherit}
.rank-row:hover,.rank-row:focus-visible{border-color:var(--dim)}
.rank-deg{font:700 1.15rem/1 var(--display);min-width:26px;color:var(--dim)}
.rank-body{flex:1;min-width:0}
.rank-label{display:block;font-weight:600;font-size:.93rem}
.rank-body small{display:block;color:var(--muted);font-size:.75rem;margin:3px 0 7px}
.rank-bar{display:block;height:4px;border-radius:99px;background:var(--line)}
.rank-bar i{display:block;height:100%;border-radius:99px;background:var(--dim)}
.rank-note{margin:16px 0 0;font-size:.79rem;line-height:1.6;color:var(--muted)}
.rel-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;max-height:560px;overflow-y:auto}
.rel-table{width:100%;min-width:640px;border-collapse:collapse;font-size:.85rem}
.rel-table th{position:sticky;top:0;z-index:1;background:var(--paper);text-align:left;font:600 .7rem/1 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line)}
.rel-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.rel-row{cursor:pointer}
.rel-row:hover td,.rel-row:focus-visible td{background:color-mix(in srgb,var(--ink),transparent 94%)}
.rel-row.is-loop td:first-child{box-shadow:inset 3px 0 0 var(--focus)}
.rel-why{color:var(--muted);line-height:1.5;max-width:34ch}
.dim-tag{display:inline-block;min-width:19px;text-align:center;margin-right:8px;padding:2px 5px;border-radius:5px;font:700 .68rem/1.4 var(--font);color:#fff;background:var(--dim)}
.rel-tag{display:inline-block;padding:4px 9px;border-radius:999px;font:600 .68rem/1 var(--font);letter-spacing:.05em;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.rel-tag.doc{border-color:var(--focus);color:var(--focus)}
/* ── Ruta crítica ── */
.route-section{padding:78px 0 96px}
.route-figure{margin:0;overflow-x:auto}
.route-figure svg{width:100%;min-width:620px;height:auto;display:block}
.route-orbit{fill:none;stroke:var(--line);stroke-dasharray:3 9}
.route-tie{fill:none;stroke:var(--role);stroke-width:1.6;opacity:.5}
.route-spine{stroke:var(--chapter-ink,var(--ink));stroke-width:2;opacity:.55}
.route-head{fill:var(--chapter-ink,var(--ink));opacity:.55}
.route-link rect{fill:var(--chapter-bg,var(--paper));stroke:var(--chapter-ink,var(--ink));stroke-width:1.5}
.route-core circle{fill:var(--chapter-ink,var(--ink))}
.route-core .route-kind,.route-core .route-name{fill:var(--chapter-bg,var(--paper))}
.route-kind{font:600 10.5px/1 var(--font);letter-spacing:.11em;fill:var(--muted)}
.route-name{font:650 17px/1 var(--display);fill:var(--chapter-ink,var(--ink))}
.route-name.lg{font-size:19px}
.route-actor circle{fill:var(--role)}
.route-actor text{font:600 13px/1 var(--font);fill:var(--chapter-ink,var(--ink))}
.route-actor .actor-tag{font:600 10px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;fill:var(--role)}
.route-actor{cursor:pointer}
.route-actor:hover circle,.route-actor:focus-visible circle{r:17}
.route-legend{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin:26px 0 0;font-size:.82rem}
.route-legend span{display:flex;align-items:center;gap:8px;color:var(--muted)}
.route-legend i{width:11px;height:11px;border-radius:50%;background:var(--role)}
.route-legend .route-rule{flex:1;min-width:260px;font-style:italic}
.route-read{margin:26px 0 0;max-width:760px}
.route-read p{margin:0 0 9px;line-height:1.6}
@media(max-width:920px){.conn-grid{grid-template-columns:1fr;gap:34px}}
@media(max-width:560px){.conn-section,.route-section{padding-left:0;padding-right:0}.role-legend{gap:9px 14px}}

/* Contención de desbordes: los hijos del grid no heredan el min-content de la tabla. */
.conn-grid>*{min-width:0}
.rel-block,.rank-block{min-width:0;max-width:100%}
.rank-row{max-width:100%}
.rank-label,.rank-body small{overflow-wrap:anywhere}
.chapter-nav nav{flex-wrap:wrap;row-gap:6px}
@media(max-width:700px){.chapter-nav nav{gap:16px}.chapter-nav nav a{font-size:16px}.rel-table{min-width:520px}.rel-why{max-width:26ch}}

/* ── Decisión: del bloque 1 al bloque 2 ── */
.decision-section{padding:96px 0;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.decision-section .section-heading{margin-bottom:44px}
.chosen-tag{display:inline-block;margin-left:12px;padding:4px 10px;border-radius:999px;font:600 .62rem/1 var(--font);letter-spacing:.1em;text-transform:uppercase;background:var(--chapter);color:var(--paper);vertical-align:middle}
.filtro{margin:0 0 44px;padding:26px 28px;border:1px solid var(--line);border-radius:16px}
.filtro h3{margin:0 0 18px;font:700 1.05rem/1.2 var(--display)}
.filtro ol{margin:0;padding:0;list-style:none;counter-reset:f;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px 30px}
.filtro li{counter-increment:f;position:relative;padding-left:34px;font-size:.9rem;line-height:1.5}
.filtro li::before{content:counter(f,decimal-leading-zero);position:absolute;left:0;top:1px;font:600 .74rem/1.6 var(--font);color:var(--muted)}
.filtro strong{display:block;font-weight:650;margin-bottom:3px}
.filtro span{color:var(--muted)}
.candidatas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin:0 0 44px}
.candidata{padding:24px 24px 26px;border:1px solid var(--line);border-radius:16px;border-top:4px solid var(--chapter)}
.candidata.gana{border-color:var(--chapter);box-shadow:0 0 0 1px var(--chapter)}
.cand-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cand-num{font:700 .8rem/1 var(--font);letter-spacing:.1em;color:var(--muted)}
.cand-veredicto{font:600 .64rem/1 var(--font);letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.candidata.gana .cand-veredicto{background:var(--chapter);color:var(--paper);border-color:var(--chapter)}
.candidata h3{margin:0 0 10px;font:700 1.28rem/1.2 var(--display)}
.candidata p{margin:0 0 10px;font-size:.92rem;line-height:1.6}
.cand-hereda,.cand-recorte{color:var(--muted);font-size:.86rem!important}
.cand-recorte em{font-style:normal;font-weight:650;color:var(--ink)}
.hereda{max-width:820px}
.hereda h3{margin:0 0 12px;font:700 1.12rem/1.25 var(--display)}
.hereda p{margin:0 0 10px;line-height:1.65}
.deep-dive .chapter-nav .num{opacity:.55}
@media(max-width:700px){.decision-section{padding:64px 0}.filtro{padding:20px}.chosen-tag{display:block;margin:6px 0 0}}

/* El insight ocupa el lugar donde antes iba la cifra. El dato queda a un clic. */

.hero-stat .big.claim{font:650 clamp(31px,3vw,44px)/1.12 var(--display);letter-spacing:-.025em}

@media(max-width:800px){.mini-stat.is-claim{font-size:26px;max-width:none}.hero-stat .big.claim{font-size:30px}}

/* El panel de stakeholder ahora lleva una categoría y una explicación corta. */
.por-que{margin:16px 0 0;font-size:1.02rem;line-height:1.6;max-width:46ch}
.rol-nota{margin:14px 0 0;padding-left:14px;border-left:2px solid var(--line);font-size:.9rem;line-height:1.55;color:var(--muted);max-width:46ch}

/* La etiqueta de la problemática elegida, más presente. */
.chosen-tag{font:700 .78rem/1 var(--font);letter-spacing:.09em;padding:8px 15px;margin-left:16px}

/* ── Ajustes de lectura pedidos por el equipo ── */
/* El título ya no comparte fila con nada: que ocupe su ancho. */
.chapter-heading.solo{display:block;max-width:none}

.reduccion .flecha{font-size:1.5rem;color:var(--map-accent);opacity:.45}

 envipe:{name:'INEGI · ENVIPE Jalisco',title:'Victimización, denuncia y costos del delito',year:'2025',scope:'Jalisco · delitos ocurridos en 2024',url:'https://www.inegi.org.mx/contenidos/programas/envipe/2025/doc/envipe2025_jal.pdf',page:'Láminas 17, 21–24',note:'Verificado contra el documento el 8 de septiembre de 2026. Cifra oculta 91.7%, definida por INEGI como delitos no denunciados + denunciados sin carpeta + no especificados. Motivos de no denuncia: pérdida de tiempo 31.4% y desconfianza 15.9%, ambos clasificados por INEGI como causas atribuibles a la autoridad. Costo total en hogares: 25.8 mil millones de pesos, 9,100 por persona afectada. LÍMITES: no es una tasa de impunidad; las razones de no denuncia son percepciones reportadas por las víctimas; en cambios de conducta el informante pudo elegir varias respuestas, así que esos porcentajes no suman 100.'},

 roles:[{name:'Pacientes y familias',role:'Viven la brecha',cat:'afectado',porQue:'Reciben tratamiento pero no llegan al control, y esa distancia entre una cosa y la otra la cubre el hogar: consultas, estudios, medicamento y tiempo de cuidado. El sistema los cuenta como atendidos aunque el padecimiento siga avanzando.',dim:'S',verb:'Cuidan y pagan',bullets:['Sostienen el tratamiento cotidiano.','Absorben parte del costo de atención.'],detail:'Son personas afectadas y redes de cuidado. El mapa no atribuye el mal control a una decisión individual.',sources:['ensanut','ciep']},{name:'Equipos de salud y unidades',role:'Operan la atención',cat:'afectado',porQue:'Trabajan con una capacidad instalada que no deciden ellos. La falta de personal y de camas les llega como carga diaria, no como decisión propia, y son quienes dan la cara cuando el sistema no alcanza.',nota:'También actúan en contra del problema cuando sostienen la continuidad del cuidado.',dim:'L',verb:'Atienden con lo que hay',bullets:['Conectan consulta, tratamiento y control.','Trabajan con la capacidad que se les asigna.'],detail:'La continuidad clínica es una palanca sugerida por el estudio. Su muestra incluye varios servicios de salud: los resultados no son exclusivos del IMSS.',sources:['ensanut','nom']},{name:'Autoridades y gobierno',role:'Asignan el presupuesto',cat:'perpetrador',porQue:'Deciden cuánto se financia el sistema, y ese techo condiciona todo lo demás: cuánto personal hay, cuántas camas, si el medicamento llega. La decisión se toma lejos del consultorio, pero se siente ahí.',nota:'También fijan el estándar clínico que obliga a prevenir, tratar y controlar.',dim:'P',verb:'Deciden la capacidad',bullets:['Determinan capacidad y prioridades.','Establecen estándares de atención.'],detail:'México destina 5.9% del PIB a gasto total en salud frente a 9.3% del promedio OCDE, panorama 2025. Es gasto total, no presupuesto público. La NOM-015 establece el marco de prevención, tratamiento y control.',sources:['oecd','nom']},{name:'Industria farmacéutica y proveedores',role:'Surten el medicamento',cat:'perpetrador',porQue:'Su entrega depende del pago, y el pago del presupuesto. Cuando no surten, el tratamiento se interrumpe aunque la consulta haya ocurrido y el diagnóstico sea correcto.',dim:'E',verb:'Distribuyen o no distribuyen',bullets:['Abastecen el medicamento del sistema público.','Su entrega depende del pago.'],detail:'El diagnóstico sectorial documenta retrasos en la distribución de medicamentos; no atribuye ese retraso a una empresa concreta ni cuantifica su efecto sobre el control del padecimiento.',sources:['sector']},{name:'Farmacias y sector privado',role:'Absorben lo no cubierto',cat:'afectado',porQue:'Reciben una demanda desplazada que no originaron: la que el sistema público no alcanzó a atender. Cobran por ello, pero no decidieron que esa demanda llegara a su mostrador.',dim:'E',verb:'Atienden la demanda que sobra',bullets:['Atienden parte de la demanda que el sistema público no alcanza.','Reciben el gasto directo de las familias.'],detail:'El análisis de ENIGH registra uso de servicios privados y farmacias. Participar en el sistema no significa causar el problema.',sources:['ciep','ensanut']}],

 roles:[{name:'Víctimas y hogares',role:'Reciben el daño',cat:'afectado',porQue:'Cargan el delito y, encima, el costo de intentar denunciarlo: el día de trabajo que se pierde, el traslado, la espera. Deciden sabiendo que lo más probable es que no pase nada, y esa expectativa acaba pesando más que el daño mismo. No denunciar no es descuido: es un cálculo razonable dentro de un sistema que no responde.',dim:'S',verb:'Evalúan si vale la pena',bullets:['Enfrentan riesgos, tiempo y costos.','Deciden bajo condiciones de confianza.'],detail:'Las razones para no denunciar son reportadas por las víctimas. Su decisión no las hace responsables del delito.',sources:['envipe']},{name:'Agresores',role:'Producen el daño',cat:'perpetrador',porQue:'Cometen el hecho y se benefician del silencio que viene después. Mientras menos se denuncia, menos probable es que alguien los investigue, y esa baja probabilidad vuelve a hacer rentable el siguiente delito. El silencio de las víctimas no es un efecto secundario del problema: es parte de lo que lo sostiene.',dim:'E',verb:'Cometen el delito',bullets:['Cometen los hechos delictivos.','Se benefician de que no se denuncie.'],detail:'La ENVIPE estudia delitos del fuero común que afectan a personas y hogares. No mide directamente delincuencia organizada.',sources:['envipe']},{name:'Fiscalía y Ministerio Público',role:'Controlan la entrada',cat:'perpetrador',porQue:'Son la única puerta formal para que un delito entre a investigación, y esa puerta está tapada. Cada agente carga cientos de expedientes al mismo tiempo, así que archivar deja de ser una decisión y se vuelve la única salida operativa. El resultado es que denunciar y ser investigado terminan siendo dos cosas distintas: la víctima cumple su parte y el caso igual se queda afuera.',nota:'También son quienes pueden abrir la carpeta: sin ellos ningún delito entra al sistema.',dim:'L',verb:'Dificultan denunciar',bullets:['Reciben denuncias y abren carpetas.','La saturación decide qué avanza.'],detail:'La brecha entre denunciar y abrir carpeta es un dato de ENVIPE, no una imputación de responsabilidad individual.',sources:['envipe']},{name:'Policías',role:'Primer contacto',cat:'perpetrador',porQue:'Son el primer trato que recibe una víctima, y ese trato define si vuelve o no. La actitud hostil y el miedo a que la propia autoridad extorsione aparecen entre los motivos declarados para no denunciar. Cuando el primer contacto desalienta en lugar de acompañar, el delito se pierde antes de llegar siquiera al Ministerio Público.',nota:'También previenen y atienden el primer contacto, que es donde se podría construir confianza.',dim:'P',verb:'Desalientan la denuncia',bullets:['Articulan respuesta y prevención.','Su trato condiciona si la víctima denuncia.'],detail:'ENVIPE incluye la actitud hostil de la autoridad y el miedo a la extorsión entre los motivos de no denuncia. Son percepciones reportadas por las víctimas, no una acusación probada contra toda la institución.',sources:['envipe']},{name:'Comunidad y redes vecinales',role:'Sostienen el entorno',cat:'afectado',porQue:'El miedo les cambia la vida cotidiana: dejan de permitir que los menores salgan solos y dejan de visitar a su gente. Al replegarse pierden exactamente lo que las protegía, porque la vigilancia informal de una calle con vecinos que se conocen desaparece cuando nadie sale. El delito no sólo les quita bienes: les quita el tejido.',nota:'También pueden organizarse para prevenir, en lugar de replegarse.',dim:'S',verb:'Se repliegan',bullets:['Aportan redes de apoyo y vigilancia.','El miedo disuelve esas mismas redes.'],detail:'Los cambios de conducta corresponden a Jalisco, datos 2024, ENVIPE 2025. La organización vecinal es una línea de intervención propuesta, no un resultado evaluado, y no traslada al hogar una obligación del Estado.',sources:['envipe']}],

 enoejal:{name:'INEGI · ENOE Jalisco',title:'Mercado laboral de Jalisco',year:'2026',scope:'Jalisco · segundo trimestre de 2026',url:'https://www.inegi.org.mx/contenidos/saladeprensa/boletines/2026/enoe/enoe2026_08_Jal.pdf',page:'Principales resultados para Jalisco',note:'VERIFICADO contra el boletín el 8 de septiembre de 2026. En el segundo trimestre de 2026 la tasa de informalidad laboral en Jalisco fue de 46.5% y la tasa de condiciones críticas de ocupación llegó a 25.4%, cuando en 2025 era 16.9%. La población ocupada bajó en 52 mil personas respecto al año anterior. LÍMITE: son datos de toda la población ocupada de 15 años y más, no exclusivamente de jóvenes.'},
 iiegviv:{name:'IIEG Jalisco · Índice de precios de la vivienda',title:'Cuánto sube la vivienda en la ZMG',year:'2026',scope:'Zona Metropolitana de Guadalajara · primer trimestre de 2026',url:'https://iieg.gob.mx/ns/wp-content/uploads/2026/06/ficha_indice_precios_vivienda_zmg_jalisco_1T_2026.pdf',page:'Variación anual por zona metropolitana y por entidad',note:'VERIFICADO contra la ficha el 8 de septiembre de 2026. La Zona Metropolitana de Guadalajara registró un aumento anual de 12.46% en el precio de la vivienda durante el primer trimestre de 2026, contra 8.74% del promedio nacional. Jalisco fue la segunda entidad del país con mayor crecimiento de precios. LÍMITES: es precio de vivienda con crédito hipotecario, no renta, y es variación nominal.'},
 diabjal:{name:'IIEG Jalisco · Defunciones por diabetes',title:'La diabetes entre las causas de muerte en Jalisco',year:'2024',scope:'Jalisco · defunciones registradas 2023',url:'https://iieg.gob.mx/ns/wp-content/uploads/2024/11/D%C3%ADaMundialDiabetes2024.pdf',page:'Panorama de las defunciones por diabetes mellitus en la entidad',note:'VERIFICADO contra la ficha el 8 de septiembre de 2026. En 2023 se registraron 5,575 defunciones de residentes de Jalisco por diabetes mellitus. Es la tercera causa de muerte en la entidad, después de las enfermedades del corazón y los tumores malignos. LÍMITE: la ficha reporta defunciones, no prevalencia ni control del padecimiento.'},

 rezago:{name:'INEGI · Censo de procuración de justicia',title:'Rezago de carpetas en las fiscalías estatales',year:'2025',scope:'Jalisco y México · carpetas pendientes',scope:'Jalisco · determinaciones en investigación inicial, datos 2024',url:'https://www.inegi.org.mx/contenidos/programas/cnpje/2025/tabulados/cnpje2025_proc_just.xlsx',page:'Tabulado 13 · determinaciones por entidad federativa según tipo',note:'VERIFICADO en el tabulado del censo el 8 de septiembre de 2026. De las 145,780 determinaciones que Jalisco efectuó en la etapa de investigación inicial durante 2024, 93,048 fueron archivo temporal: el 63.8%. El promedio nacional es 37.9%. Jalisco archiva casi el doble. Sólo el 14.5% de sus determinaciones llegó al ejercicio de la acción penal. El archivo temporal guarda la carpeta sin cerrarla ni avanzarla.'},
 fiscalias:{name:'INEGI · Censo Nacional de Procuración de Justicia',title:'Volumen de carpetas y personal de las fiscalías',year:'2025',scope:'Jalisco · carpetas y agentes del Ministerio Público, datos 2024',url:'https://www.inegi.org.mx/contenidos/programas/cnpje/2025/tabulados/cnpje2025_est_org_rec.xlsx',page:'Tabulados 6 y 10 · personal y carpetas por entidad federativa',note:'VERIFICADO en los tabulados del censo el 8 de septiembre de 2026. Jalisco cerró 2024 con 504,184 carpetas de investigación pendientes y 701 agentes del Ministerio Público: 719 carpetas pendientes por agente. El promedio nacional es de 143 por agente, así que la carga en Jalisco es cinco veces mayor. En el año se abrieron 124,089 carpetas nuevas y la Fiscalía ejerció un presupuesto de 2,644.8 millones de pesos. LÍMITE: el censo no incluye a la Ciudad de México, que no entregó el módulo completo.'},
 evalua:{name:'México Evalúa · Radiografía de la Impunidad',title:'Qué proporción de los delitos llega a resolverse',year:'2024',scope:'México · sistema de justicia penal',url:'https://mexicoevalua.org/solo-1-de-cada-10-casos-se-resuelve-en-mexico-radiografia-de-la-impunidad-propone-soluciones-para-fortalecer-la-justicia-penal/',page:'Radiografía de la Impunidad 2024 · flujo procesal e IIPI',note:'VERIFICADO contra el documento el 8 de septiembre de 2026. El 93% de los delitos no se denuncia, dato que el estudio toma de la ENVIPE del INEGI. De las denuncias que sí ocurren, el 93.8% deriva en la apertura de una carpeta, pero sólo el 6.28% de los casos acumulados llega al ejercicio de la acción penal. El Índice de Impunidad Penal Institucional estima que el 89.42% de los casos que el sistema debía resolver en 2024 no obtuvo solución efectiva. Entre 2019 y 2024 los casos pendientes en fiscalías pasaron de 1.3 a 2.6 millones. CORRECCIÓN: la cifra de 99.23% que circuló en prensa NO aparece en el estudio.'},

 pestel:{name:'CIPD · PESTLE analysis',title:'El marco PESTEL',year:'2025',scope:'Marco metodológico · factores externos',url:'https://www.cipd.org/uk/knowledge/factsheets/pestle-analysis-factsheet/',page:'What is a PESTLE analysis?',note:'Clasifica seis dimensiones del entorno. Esta visualización adapta el marco al análisis de problemas sociales. No aporta una fórmula de ponderación causal.'},

const expanded={
 salud:{bg:'#cbe5d9',ink:'#133c32',mapBg:'#0b302b',mapAccent:'#abe1c2',summary:'La capacidad pública concentra más factores en este recorte. Los costos, la continuidad y la información clínica conectan distintas dimensiones.',
 nodes:[
 N('p1','El gasto en salud\nse queda corto','P','factor','México gasta en salud una proporción de su economía muy por debajo de los países con los que se compara. Ese techo no es un número abstracto: define cuántas personas atienden, con qué equipo y en cuántas horas. Todo lo demás se acomoda a lo que ese presupuesto permite.','oecd'),
 N('p2','Faltan médicos\ny enfermeras','P','factor','No hay suficiente personal médico y de enfermería para la gente que llega. Eso se traduce en consultas más cortas, citas más separadas y menos tiempo para explicar cómo vivir con un padecimiento crónico, que es justo lo que decide si se controla.','oecd'),
 N('p3','No hay camas\nsuficientes','E','context','El número de camas por habitante está muy por debajo del referente internacional. No es una decisión clínica sino la consecuencia económica de años de financiamiento ajustado: se atiende lo urgente y el seguimiento se posterga.','oecd'),
 N('p4','El medicamento\nno llega al anaquel','P','factor','El medicamento existe, está recetado, y aun así no está en el anaquel el día que la persona va por él. Cuando eso pasa, o lo compra por su cuenta o interrumpe el tratamiento. Ninguna de las dos salidas es gratis.','sector'),
 N('p5','Los servicios no\nse hablan entre sí','P','factor','La persona pasa por el primer nivel, por el especialista y por urgencias, pero cada uno la atiende como si fuera la primera vez. Nadie tiene la película completa de su padecimiento, sólo fotos sueltas.','sector'),
 N('e1','El ingreso no alcanza\npara atenderse','E','factor','Cuando el ingreso apenas cubre lo básico, cualquier gasto de salud compite con la comida o la renta. La decisión de saltarse un estudio o media dosis no es descuido: es aritmética.','ensanut'),
 N('e2','Llegar a consulta\ncuesta pasaje y horas','E','factor','Ir a consulta implica pasaje, a veces varios camiones, y tiempo. Para un padecimiento que exige volver cada mes durante años, ese costo se acumula hasta volverse la razón por la que se deja de ir.','sector'),
 N('e3','La familia compra\nel medicamento','E','factor','Lo que el sistema no surte, lo compra la familia. Es un gasto que se repite cada mes y que nadie presupuestó, y es de los primeros que se recorta cuando el dinero no alcanza.','ciep'),
 N('s1','Nadie acompaña entre\nuna consulta y otra','S','factor','A una persona con diabetes le dan tratamiento y una cita de control, pero entre una consulta y la siguiente nadie la acompaña. Si falta, nadie la busca. El tratamiento sigue existiendo en el expediente y el control se pierde en la vida real.','ensanut'),
 N('s2','El tratamiento\nse toma a medias','S','factor','Tomar medicamento todos los días durante años, sin sentirse mal, es difícil de sostener. Sin acompañamiento la persona ajusta la dosis por su cuenta, la espacia o la suspende cuando se siente bien.','ensanut'),
 N('s3','La consulta choca\ncon el trabajo','S','factor','La consulta es en horario laboral y la persona trabaja en horario laboral. Ir significa pedir permiso o perder el día, así que se pospone hasta que hay una urgencia.','sector'),
 N('s4','La clínica queda\nlejos de casa','S','factor','Vivir lejos de donde se atiende convierte una consulta de veinte minutos en una salida de medio día. La distancia no impide ir una vez; impide ir todos los meses.','sector'),
 N('t1','Cada institución guarda\nsu propio expediente','T','factor','El historial de una persona está partido entre el IMSS, la clínica privada y el hospital al que llegó de urgencia. Cada quien guarda su pedazo y nadie ve el conjunto.','sector'),
 N('t2','Los sistemas no\ncomparten el historial','T','factor','Aunque exista el expediente electrónico, las instituciones no lo comparten entre sí. El resultado es que el médico de hoy no puede ver lo que hizo el de hace tres meses.','sector'),
 N('k1','El aire contaminado\nagrava el padecimiento','K','factor','La mala calidad del aire agrava padecimientos respiratorios y cardiovasculares. Es una carga que llega a la misma consulta ya saturada, sin que nadie la haya provocado desde el consultorio.','air'),
 N('l1','La norma obliga,\npero no da recursos','L','context','Existe una norma oficial que establece cómo prevenir, tratar y controlar el padecimiento. Marca la obligación, pero no aporta el personal ni el tiempo para cumplirla.','nom'),
 N('l2','El derecho existe,\nno el control efectivo','L','context','El derecho a la salud está reconocido y comprende el control efectivo, no sólo la puerta abierta. La distancia entre ese derecho y lo que ocurre en la consulta es exactamente el problema.','sector'),
 N('f1','El padecimiento avanza\naunque haya tratamiento','S','effect','Tener tratamiento no es lo mismo que tener el padecimiento bajo control. La persona está diagnosticada y medicada, pero sus niveles siguen fuera de rango y el daño avanza en silencio, mientras el sistema la cuenta como atendida.','ensanut'),
 N('f2','El hogar paga lo que\nel sistema no cubre','E','effect','Consultas, estudios, traslados y medicamento que el sistema no cubrió. Es dinero que sale del gasto familiar cada mes, sin aparecer en ningún presupuesto público.','ciep'),
 N('f3','El gasto médico desplaza\nal resto del presupuesto','E','effect','Un gasto de salud recurrente desplaza a los demás. La familia deja de ahorrar, se endeuda o recorta en otra cosa, y ese apretón vuelve a hacer más difícil sostener el tratamiento.','ciep'),
 N('f4','Se llega por urgencias,\nno por control','P','effect','Cuando el seguimiento falla, la persona vuelve al sistema por urgencias y no por consulta. Se atiende la crisis, que cuesta más y llega peor, en vez del control que la habría evitado.','sector'),
 N('f5','Se repiten estudios\nya hechos','T','effect','Sin historial compartido, el siguiente médico vuelve a pedir lo que ya se hizo. Se gasta dos veces lo mismo y la persona pierde otra vuelta.','sector'),
 N('f6','Se acumula daño\nrespiratorio','K','effect','La exposición sostenida al aire contaminado deteriora las vías respiratorias y suma consultas a un sistema que ya no da abasto.','air'),
 N('f7','Se acumula daño\ncardiovascular','K','effect','La misma exposición se asocia con daño al corazón y a los vasos sanguíneos, y agrava lo que un padecimiento crónico mal controlado ya venía haciendo.','air'),
 N('f8','Se muere de algo que\nse podía controlar','S','effect','En Jalisco la diabetes está entre las primeras causas de muerte, sólo por debajo de las enfermedades del corazón y los tumores. Es el desenlace de un padecimiento que, controlado a tiempo, no tendría por qué llegar hasta ahí.','diabjal')],

 cardiovascular.','air'),R('f6','p3','La carga respiratoria aumenta demanda de atención.'),R('f7','f2','Los problemas de salud pueden añadir costos al hogar.'),R('f4','s2','Los retrasos en la atención pueden interrumpir la regularidad del tratamiento.'),R('f4','e2','Un retraso obliga a repetir el traslado y suma costo al hogar.'),R('f6','s1','La carga respiratoria añade consultas y compite con el seguimiento de otro padecimiento.'),R('f5','p2','La duplicidad de registros consume tiempo de un personal ya insuficiente.'),R('f5','e2','Repetir estudios puede implicar traslados adicionales para el hogar.'),R('l2','f1','El derecho a la salud enmarca el control efectivo del padecimiento, no sólo el acceso a la consulta.'),R('e3','s2','Cuando el medicamento se paga de bolsillo, su uso puede volverse irregular.'),R('f1','f8','Un padecimiento que avanza sin control termina en complicaciones graves, y en Jalisco eso lo coloca entre las principales causas de muerte.','diabjal'),R('f4','f8','Llegar por urgencias en vez de por control significa llegar cuando el daño ya está hecho.'),R('s1','f8','Sin acompañamiento entre consultas, el padecimiento avanza en silencio hasta que ya no se puede revertir.')],
 causeIds:['s1','e3','t2','k1'],effectIds:['f1','f2','f5','f6'],gap:'Salud se analiza como sistema; diabetes es un indicador de resultado. Los factores ambientales describen carga general de enfermedad, no una explicación del 33% de control.'},
 seguridad:{bg:'#eed1c0',ink:'#542a25',mapBg:'#402026',mapAccent:'#f3bba7',summary:'Los factores institucionales y sociales se entrelazan: tiempo, trato, confianza y miedo. Los efectos económicos son visibles, aunque no equivalen a las causas de no denuncia.',
 nodes:[
 N('p1','Denunciar cuesta\nun día de trabajo','P','factor','Denunciar exige presentarse en persona, en horario de oficina. Para quien trabaja, significa perder el día. El trámite compite directamente con el ingreso.','envipe'),
 N('p2','El trámite no está\nclaro para nadie','P','factor','El proceso es largo y poco claro. Nadie explica los pasos completos, y la víctima descubre sobre la marcha qué documento le falta.','envipe'),
 N('p3','A la víctima la tratan\ncomo sospechosa','P','factor','La persona llega a denunciar un delito y sale sintiéndose sospechosa. El trato que recibe en la ventanilla define si vuelve o no.','envipe'),
 N('p4','Miedo a que la propia\nautoridad extorsione','P','factor','Una parte de las víctimas teme que acercarse a la autoridad la exponga a esa misma autoridad. Es un motivo declarado en la encuesta, no una acusación probada.','envipe'),
 N('s1','La gente ya no\nespera respuesta','S','factor','No es apatía. Es la conclusión de haber visto que las denuncias no avanzan: si no va a servir de nada, no vale la pena empezar.','envipe'),
 N('s2','Denunciar expone\na la víctima','S','factor','Denunciar implica quedar identificable frente a quien cometió el delito, y esa exposición pesa más que la posibilidad de justicia.','envipe'),
 N('s3','El daño parece muy\nchico para denunciar','S','factor','Cuando el daño parece pequeño, el costo de denunciar se siente más grande que el delito mismo.','envipe'),
 N('l1','Sin pruebas, la víctima\nni lo intenta','L','factor','La víctima asume que sin evidencia no la van a atender, y se ahorra el intento antes de hacerlo.','envipe'),
 N('l2','Se denuncia y no\nse abre carpeta','L','factor','Hay quien denuncia y el caso nunca se abre formalmente. Ocurre, pero es la fuga menor: la mayoría de las denuncias sí abre carpeta. El problema grande viene después.','evalua'),
 N('t1','Roban la identidad\nen línea','T','factor','Alguien usa la identidad de otra persona en servicios digitales. El daño aparece después, cuando ya se usó para algo.','cyber'),
 N('t2','Fraudes cometidos\npor internet','T','factor','El engaño ocurre en línea y el dinero se va rápido. Para cuando se identifica, el rastro ya se enfrió.','cyber'),
 N('t3','Amenazas y extorsión\npor mensaje','T','factor','Las amenazas y la extorsión llegan por mensaje. No dejan una escena física a la que llegar.','cyber'),
 N('f1','El agresor no\nenfrenta nada','L','effect','Cuando el delito no llega a investigarse, quien lo cometió no enfrenta ninguna consecuencia. No es sólo que la víctima se quede sin respuesta: es que el cálculo de quien delinque sale barato, y eso hace más probable el siguiente.','envipe'),
 N('f2','El hogar pierde\nlo que le robaron','E','effect','El hogar pierde lo robado o dañado, y esa pérdida rara vez se recupera.','envipe'),
 N('f3','La familia paga su\npropia seguridad','E','effect','Ante la falta de respuesta, la familia paga su propia seguridad: cerraduras, rejas, cámaras.','envipe'),
 N('f4','El miedo se queda\ndespués del delito','S','effect','El miedo y la ansiedad quedan mucho después del hecho, y no tienen a dónde reportarse.','envipe'),
 N('f5','Hay lesiones que\nnadie repara','S','effect','Cuando hay lesión, el costo médico se suma al daño y también lo cubre el hogar.','envipe'),
 N('f6','Los menores ya\nno salen solos','S','effect','Es lo primero que cambia una familia con miedo: los hijos dejan de moverse solos por su propia colonia.','envipe'),
 N('f7','Se deja de visitar\na la familia','S','effect','Se deja de visitar a la familia y a los amigos. El miedo achica el mundo y disuelve la red que protegía.','envipe'),
 N('f8','Se pierden días\nde trabajo','E','effect','Faltar al trabajo por el delito, por el trámite o por el daño emocional cuesta ingreso. Y ese costo empuja a no denunciar la próxima vez.','envipe'),
 N('c1','El Ministerio Público\ndecide qué avanza','L','context','Es la puerta de entrada al sistema de justicia. Denunciar y abrir carpeta son dos momentos distintos, y entre uno y otro se pierde la mayoría de los casos.','envipe'),
 N('c2','La Policía Cibernética\norienta, no investiga','T','context','Orienta y recibe reportes, pero para que el delito entre a investigación sigue habiendo que acudir en persona.','cyber'),

const Dialogo=({dato,cerrar})=>{
  const ref=useRef(null);
  useEffect(()=>{const d=ref.current;if(!d)return;
    if(dato&&!d.open)d.showModal(); if(!dato&&d.open)d.close();},[dato]);

  return (
    <dialog id="evidence" ref={ref} aria-labelledby="dialog-label" onClick={e=>{
      if(e.target!==ref.current)return;
      const r=ref.current.getBoundingClientRect();
      if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)cerrar();
    }}>
      <div className="dialog-head">
        <span id="dialog-label">{dato?dato.titulo:'Evidencia y contexto'}</span>

const SeccionCausas=({p,abrirNodo,abrirFuente})=>{
  const caja=useRef(null),svg=useRef(null);
  const dibujar=useCallback(()=>{
    const w=caja.current,s=svg.current;if(!w||!s)return;
    const box=w.getBoundingClientRect(),c=w.querySelector('.causal-center').getBoundingClientRect();
    if(box.width<600){s.innerHTML='';return}
    s.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);
    const left=c.left-box.left,right=c.right-box.left,cy=c.top-box.top+c.height/2;
    // Cada causa se une con SU efecto, pasando por el centro: el par se lee como una fila.
    const cols=[...w.querySelectorAll('.cause-column')];
    const causas=[...cols[0].querySelectorAll('.cause-node')];
    const efectos=[...cols[1].querySelectorAll('.cause-node')];
    const medio=(el,lado)=>{const b=el.getBoundingClientRect();
      return {x:(lado==='der'?b.right:b.left)-box.left, y:b.top-box.top+b.height/2}};
    s.innerHTML=causas.map((n,i)=>{
      const e=efectos[i]; if(!e)return '';
      const a1=medio(n,'der'), b1=medio(e,'izq');
      return `<path class="par" d="M${a1.x} ${a1.y}C${(a1.x+left)/2} ${a1.y} ${left} ${cy} ${left} ${cy}"/>`
           + `<path class="par" d="M${right} ${cy}C${right} ${cy} ${(right+b1.x)/2} ${b1.y} ${b1.x} ${b1.y}"/>`}).join('');
  },[]);
  useLayoutEffect(()=>{dibujar();
    const r=()=>dibujar();addEventListener('resize',r);
    document.fonts&&document.fonts.ready.then(dibujar);
    return()=>removeEventListener('resize',r)},[dibujar]);
  return(
    <section className="chapter-opening wrap reveal" id={p.id+'-causas'}>
      <div className="chapter-heading solo">
        <div><div className="eyebrow">{p.n} · {p.name}</div>
          <h2>{lineas(p.headline).map((t,i)=>(<React.Fragment key={i}>{t}<br/></React.Fragment>))}</h2></div>
      </div>
      <div className="cause-layout" ref={caja}>
        <svg className="causal-wires" ref={svg} aria-hidden="true"></svg>
        <div className="cause-column"><p className="col-label">Causas</p>
          {p.causes.map(n=><NodoCausa key={n.id} n={n} p={p} abrirNodo={abrirNodo}/>)}</div>
        <div className="causal-center"><span>La problemática</span><h3>{plain(p.center)}</h3></div>
        <div className="cause-column"><p className="col-label">Efectos</p>
          {p.effects.map(n=><NodoCausa key={n.id} n={n} p={p} abrirNodo={abrirNodo}/>)}</div>
      </div>
      <div className="takeaway"><p>{p.takeaway}</p>
        </div>
    </section>);
};

/* ── Bloque 2 · el mapa interactivo ───────────────────────────────────────── */
// Las causas rodean el problema por la izquierda; los efectos, por la derecha.
// Dentro de cada lado los nodos se ordenan por dimensión PESTEL, así que los
// colores quedan juntos. Se calcula: agregar un nodo nunca rompe el mapa.
const ANCHO=2020, ALTO=1500, CX=1010, CY=750;
const ANILLOS=[{rx:300,ry:214},{rx:490,ry:358},{rx:680,ry:502},{rx:870,ry:646}];
function acomodar(p){
  const nodos=[], etiquetas=[];
  const reparte=(lista,a0,a1,nAnillos)=>{
    const orden=[]; for(const d of DIM_ORDER) orden.push(...lista.filter(n=>n.dim===d));
    const n=orden.length; if(!n) return;
    const usa=ANILLOS.slice(0,Math.min(nAnillos,Math.max(1,Math.ceil(n/3))));
    const paso=(a1-a0)/n, vistos={};
    orden.forEach((nodo,i)=>{
      const gr=a0+paso*(i+0.5), ang=gr*Math.PI/180, an=usa[i%usa.length];
      nodos.push({...nodo,x:CX+an.rx*Math.cos(ang),y:CY+an.ry*Math.sin(ang)});
      (vistos[nodo.dim]=vistos[nodo.dim]||[]).push(gr);
    });
    const ext=ANILLOS[usa.length-1];
    for(const d in vistos){
      const as=vistos[d], medio=(as[0]+as[as.length-1])/2*Math.PI/180;
      etiquetas.push({dim:d,x:CX+(ext.rx+96)*Math.cos(medio),y:CY+(ext.ry+78)*Math.sin(medio)});
    }
  };
  reparte(p.nodes.filter(n=>n.kind!=='effect'),94,266,4);
  reparte(p.nodes.filter(n=>n.kind==='effect'),-76,76,3);
  return {nodos,etiquetas};
}
const curva=(a,b,seed=0)=>{const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,
  l=Math.hypot(dx,dy)||1,bend=(seed%2?1:-1)*Math.min(85,l*.14);
  return `M${a.x} ${a.y}Q${mx-dy/l*bend} ${my+dx/l*bend} ${b.x} ${b.y}`};
const CENTRO={salud:['Salud','sin continuidad'],seguridad:['Delitos sin','investigación'],juventud:['Autonomía','con barreras']};

const Grafo=memo(({p,estado,seleccionar,reiniciar})=>{
  const {nodos}=acomodar(p);
  const idx=Object.fromEntries(nodos.map(n=>[n.id,n]));
  const hub={x:CX,y:CY};
  const activos=new Set();
  if(estado.selected){activos.add(estado.selected);
    p.relations.forEach(r=>{if(r.a===estado.selected)activos.add(r.b);if(r.b===estado.selected)activos.add(r.a)})}
  else p.nodes.forEach(n=>{if((estado.mode==='all'||n.kind===estado.mode)&&(estado.dimension==='all'||n.dim===estado.dimension))activos.add(n.id)});
  const at=(base,on)=>base+(on?'':' dim');
  const maxG=Math.max(...p.nodes.map(n=>p.degree[n.id]));
  return(
  <figure className="neural-figure" aria-label={'Mapa de causas y efectos de '+p.name}>
    <svg className="neural-svg" viewBox={`0 0 ${ANCHO} ${ALTO}`} role="group" aria-label={'Mapa PESTEL interactivo de '+p.name}>
      <g aria-hidden="true">
        <text className="lado-label" x="44" y="58">CAUSAS</text>
        <text className="lado-label der" x={ANCHO-44} y="58" textAnchor="end">EFECTOS</text>
        {ANILLOS.slice(0,3).map((a,i)=><ellipse key={i} className="orbit-guide" cx={CX} cy={CY} rx={a.rx} ry={a.ry}/>)}
        {nodos.map((n,i)=><path key={'h'+n.id} className={at('neural-edge hub-edge',activos.has(n.id))+(estado.selected===n.id?' active':'')}
          d={curva(n,hub,i)} style={{'--edge-color':DIM[n.dim].color}}/>)}
        {p.relations.map((r,i)=>{const A=idx[r.a],B=idx[r.b]; if(!A||!B)return null;
          const d=curva(A,B,i);
          const on=estado.selected?(r.a===estado.selected||r.b===estado.selected):(activos.has(r.a)&&activos.has(r.b));
          return(<React.Fragment key={'r'+i}>
            <path className={at('neural-edge inter',on)+(estado.selected&&on?' active':'')} d={d} style={{'--edge-color':DIM[A.dim].color}}/>
            {i%4===0&&<circle className={at('signal',on)} r="3"><animateMotion dur={(7+i%5)+'s'} begin={'-'+(i%7)+'s'} repeatCount="indefinite" path={d}/></circle>}
          </React.Fragment>)})}
      </g>
      {nodos.map((n,i)=>{const g=p.degree[n.id],sel=estado.selected===n.id,manda=g>=maxG*0.7;
        return(<g key={n.id} className={'neural-node'+(activos.has(n.id)?'':' dim')+(estado.selected&&activos.has(n.id)&&!sel?' related':'')+(manda?' manda':'')}
          role="button" tabIndex="0" aria-pressed={sel}
          aria-label={`${plain(n.label)} · ${kindName(n.kind)} · ${DIM[n.dim].name} · ${g} conexiones`}
          onClick={()=>seleccionar(n.id)}
          onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();seleccionar(n.id)}}}
          transform={`translate(${n.x} ${n.y})`} style={{'--node-color':DIM[n.dim].color}}>
          <circle className="halo" r="30"/>
          {n.kind==='context'?<rect className="point" x="-9" y="-9" width="18" height="18" rx="2"/>:<circle className="point" r={8+Math.min(g,7)*1.6}/>}
          <text className="grado-num" x="0" y="-26" textAnchor="middle">{g}</text>
          {lineas(n.label).map((t,k)=><text key={k} x="0" y={38+k*20} textAnchor="middle">{t}</text>)}
        </g>)})}
      <g className="hub" role="button" tabIndex="0" aria-label={'Ver toda la red de '+p.name}
         onClick={reiniciar} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reiniciar()}}}
         transform={`translate(${hub.x} ${hub.y})`}>
        <circle className="hub-ring" r="118"/><circle className="hub-core" r="104"/>
        <text className="hub-label" x="0" y="-46" textAnchor="middle">{p.n} · PROBLEMA</text>
        {lineas(p.center).map((t,i)=><text key={i} x="0" y={-10+i*30} textAnchor="middle">{t}</text>)}
        <text className="hub-action" x="0" y="72" textAnchor="middle">Ver toda la red ↗</text>
      </g>
    </svg>
  </figure>)});

const Inspector=({p,estado,activos,seleccionar,reiniciar,abrirNodo,abrirRelacion,abrirMetodo})=>{

        <div className="related-links">{p.nodes.filter(n=>activos.has(n.id)).map(n=>
          <button key={n.id} onClick={()=>seleccionar(n.id)}>{plain(n.label)} ↗</button>)}</div></div>
    </React.Fragment>)}
  return(<React.Fragment>
    <div><div className="detail-kind">{p.nodes.length} nodos · {p.relations.length} relaciones entre nodos</div>
      <h3>Todo está<br/>conectado.</h3>
      <button className="ref" onClick={()=>abrirMetodo(p)}>Cómo interpretar la red ↗</button></div>
    <div><p>Toca el problema para activar toda la red. Selecciona una causa o efecto para iluminar sus relaciones.</p>
      <p className="relation-detail">Círculos llenos: factores. Aros: efectos. Cuadrados: contexto. La evidencia de cada nodo se consulta aquí.</p></div>
  </React.Fragment>)};

/* ── Conexiones y ruta crítica ────────────────────────────────────────────── */
const Conexiones=({p,abrirNodo,abrirRelacion})=>{
  // De lo general a lo particular: se conservan sólo los nodos que más conectan.
  const umbral=Math.max(4,Math.round(p.degree[p.ranked[0].id]*0.4));
  const dentro=p.nodes.filter(n=>p.degree[n.id]>=umbral);
  const ids=new Set(dentro.map(n=>n.id));
  const rels=p.relations.filter(r=>ids.has(r.a)&&ids.has(r.b));
  const sub={...p,nodes:dentro,relations:rels};
  const [sel,setSel]=useState(null);
  const {nodos}=acomodar(sub);
  const idx=Object.fromEntries(nodos.map(n=>[n.id,n]));
  const hub={x:CX,y:CY};
  const activos=new Set();
  if(sel){activos.add(sel);rels.forEach(r=>{if(r.a===sel)activos.add(r.b);if(r.b===sel)activos.add(r.a)})}
  else dentro.forEach(n=>activos.add(n.id));
  const at=(b,on)=>b+(on?'':' dim');
  const dims=[...new Set(dentro.map(n=>n.dim))];
  return(
  <section className="map-section reducido" id={p.id+'-conexiones'}
    style={{'--map-bg':p.mapBg,'--map-accent':p.mapAccent}}>
    <div className="wrap">
      <div className="map-heading">
        <div><div className="eyebrow">{p.n} · De lo general a lo particular</div>
          <h2>Lo que de verdad<br/><em>carga el sistema.</em></h2></div>
        <p>Del mapa completo se conservan sólo las variables con más conexiones. Las demás no se descartan: dejan de ser el foco. Esto es lo que queda cuando se filtra el ruido.</p>
      </div>
      <div className="reduccion">
        <div><strong>{p.nodes.length}</strong><span>variables en el mapa completo</span></div>
        <div className="flecha">→</div>
        <div><strong>{dentro.length}</strong><span>que concentran las conexiones</span></div>
        <div className="flecha">→</div>
        <div><strong>{dims.length}</strong><span>dimensiones PESTEL que siguen pesando</span></div>
      </div>
    </div>
    <figure className="neural-figure">
      <svg className="neural-svg" viewBox={`0 0 ${ANCHO} ${ALTO}`} role="group"
        aria-label={'Mapa reducido de '+p.name+': sólo las variables más conectadas'}>
        <g aria-hidden="true">
          <text className="lado-label" x="44" y="58">CAUSAS</text>
          <text className="lado-label der" x={ANCHO-44} y="58" textAnchor="end">EFECTOS</text>
          {ANILLOS.slice(0,3).map((a,i)=><ellipse key={i} className="orbit-guide" cx={CX} cy={CY} rx={a.rx} ry={a.ry}/>)}
          {rels.map((r,i)=>{const A=idx[r.a],B=idx[r.b];if(!A||!B)return null;
            const on=sel?(r.a===sel||r.b===sel):true;
            return <path key={i} className={at('neural-edge inter gruesa',on)+(sel&&on?' active':'')}
              d={curva(A,B,i)} style={{'--edge-color':DIM[A.dim].color}}/>})}
        </g>
        {nodos.map(n=>{const g=p.degree[n.id];
          return(<g key={n.id} className={'neural-node'+(activos.has(n.id)?'':' dim')+(sel===n.id?' manda':'')}
            role="button" tabIndex="0" aria-pressed={sel===n.id}
            aria-label={`${plain(n.label)} · ${g} conexiones en el mapa completo`}
            onClick={()=>setSel(sel===n.id?null:n.id)}
            onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setSel(sel===n.id?null:n.id)}}}
            transform={`translate(${n.x} ${n.y})`} style={{'--node-color':DIM[n.dim].color}}>
            <circle className="halo" r="34"/>
            {n.kind==='context'?<rect className="point" x="-11" y="-11" width="22" height="22" rx="3"/>:<circle className="point" r={10+Math.min(g,10)*1.7}/>}
            <text className="grado-num" x="0" y="-30" textAnchor="middle">{g}</text>
            {lineas(n.label).map((t,k)=><text key={k} x="0" y={42+k*20} textAnchor="middle">{t}</text>)}
          </g>)})}
        <g className="hub" transform={`translate(${hub.x} ${hub.y})`} aria-hidden="true">
          <circle className="hub-ring" r="112"/><circle className="hub-core" r="98"/>
          <text className="hub-label" x="0" y="-40" textAnchor="middle">RUTA CRÍTICA</text>
          {lineas(p.center).map((t,i)=><text key={i} x="0" y={-6+i*30} textAnchor="middle">{t}</text>)}
        </g>
      </svg>
    </figure>
    <div className="wrap">
      <aside className="inspector">
        {sel?(()=>{const n=p.nodes.find(x=>x.id===sel);
          const rr=p.relations.filter(r=>r.a===n.id||r.b===n.id);
          return(<React.Fragment>
            <div><div className="detail-kind">{DIM[n.dim].name} · {p.degree[n.id]} conexiones · toca {p.crossDim[n.id]} dimensiones</div>
              <h3>{plain(n.label)}</h3>
              <button className="ref" onClick={()=>abrirNodo(p,n.id)}>Ver la evidencia ↗</button></div>
            <div><p>{n.detail}</p>
              <div className="related-links">{rr.map(r=>{const o=p.nodes.find(x=>x.id===(r.a===n.id?r.b:r.a));
                return <button key={r.a+r.b} onClick={()=>abrirRelacion(p,p.relations.indexOf(r))}>{plain(o.label)} ↗</button>})}</div></div>
          </React.Fragment>)})():(
          <React.Fragment>
            <div><div className="detail-kind">Umbral: {umbral} conexiones o más</div>
              <h3>Nueve variables<br/>sostienen el resto.</h3></div>
            <div><p>Toca cualquiera para ver con qué se conecta y por qué. Cada nodo muestra arriba su número de conexiones en el mapa completo.</p>
              <p className="relation-detail">El tamaño del círculo también crece con las conexiones. Más conexiones significa más presencia en este recorte, no mayor peso causal comprobado.</p></div>
          </React.Fragment>)}
      </aside>
    </div>
  </section>)};

const MapaRuta=({p,abrirActor})=>{
  const rs=p.roles,cx=500,cy=330,rx=418,ry=238;
  const lado=r=>r.cat==='afectado'?'right':'left';
  const ANG={left:[205,155,232,128,250,110],right:[335,25,308,52,290,70],both:[270,90,262,98]};
  const usado={left:0,right:0,both:0};
  const pos=rs.map(r=>{const g=lado(r),a=(ANG[g][usado[g]++]||270)*Math.PI/180;
    return {x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)}});
  const causa={x:150,y:cy},efecto={x:850,y:cy};
  const cortar=(t,max,lineas=2)=>{const w=t.split(' '),out=[];let cur='';
    for(const x of w){if((cur+' '+x).trim().length>max){out.push(cur.trim());cur=x}else cur+=' '+x}
    if(cur.trim())out.push(cur.trim());return out.slice(0,lineas)};
  const destino=r=>[r.cat==='afectado'?efecto:causa];
  const nucleo=cortar(plain(p.center),14,3);
  return(
  <figure className="route-figure">
    <svg viewBox="0 0 1000 640" role="img"
      aria-label={'Mapa simplificado de '+p.name+': causa crítica, problemática central, efecto crítico y anillo de stakeholders'}>
      <g aria-hidden="true">
        <ellipse className="route-orbit" cx={cx} cy={cy} rx={rx} ry={ry}/>
        {rs.map((r,i)=>destino(r).map((t,k)=>(
          <path key={i+'-'+k} className="route-tie" style={{'--role':ROLE[r.cat].light,'--role-bright':ROLE[r.cat].color}}
            d={`M${pos[i].x} ${pos[i].y}Q${(pos[i].x+t.x)/2} ${(pos[i].y+t.y)/2+(pos[i].y<cy?-34:34)} ${t.x} ${t.y}`}/>)))}
        <path className="route-spine" d={`M${causa.x+96} ${cy}H${cx-92}`}/>
        <path className="route-spine" d={`M${cx+92} ${cy}H${efecto.x-96}`}/>
        <path className="route-head" d={`m${cx-104} ${cy-8} 12 8-12 8z`}/>
        <path className="route-head" d={`m${efecto.x-108} ${cy-8} 12 8-12 8z`}/>
      </g>
      <g className="route-link"><rect x={causa.x-96} y={cy-52} width="192" height="104" rx="14"/>
        <text className="route-kind" x={causa.x} y={cy-24} textAnchor="middle">CAUSA CRÍTICA · grado {p.degree[p.criticalCause.id]}</text>
        {cortar(plain(p.criticalCause.label),18).map((t,i)=>
          <text key={i} className="route-name" x={causa.x} y={cy+4+i*24} textAnchor="middle">{t}</text>)}</g>
      <g className="route-core"><circle cx={cx} cy={cy} r="92"/>
        <text className="route-kind" x={cx} y={cy-58} textAnchor="middle">{p.n} · PROBLEMÁTICA</text>
        {nucleo.map((t,i)=><text key={i} className="route-name lg" x={cx} y={cy+12-(nucleo.length-1)*13+i*26} textAnchor="middle">{t}</text>)}</g>
      <g className="route-link"><rect x={efecto.x-96} y={cy-52} width="192" height="104" rx="14"/>
        <text className="route-kind" x={efecto.x} y={cy-24} textAnchor="middle">EFECTO CRÍTICO · grado {p.degree[p.criticalEffect.id]}</text>
        {cortar(plain(p.criticalEffect.label),18).map((t,i)=>
          <text key={i} className="route-name" x={efecto.x} y={cy+4+i*24} textAnchor="middle">{t}</text>)}</g>
      {rs.map((r,i)=>{const ls=cortar(r.name,22),arriba=pos[i].y<cy;
        return(<g key={i} className="route-actor" style={{'--role':ROLE[r.cat].light,'--role-bright':ROLE[r.cat].color}}
          role="button" tabIndex="0" onClick={()=>abrirActor(p,i)}
          onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();abrirActor(p,i)}}}
          aria-label={r.name+': '+ROLE[r.cat].name}>
          <circle cx={pos[i].x} cy={pos[i].y} r="13"/>
          {ls.map((t,j)=><text key={j} x={pos[i].x}
            y={pos[i].y+(arriba?-30-((ls.length-1-j)*19):34+j*19)} textAnchor="middle">{t}</text>)}
          <text className="actor-tag" x={pos[i].x}
            y={pos[i].y+(arriba?-30-(ls.length-1)*19-18:34+ls.length*19)} textAnchor="middle">
            {ROLE[r.cat].name}</text>
        </g>)})}
    </svg>
  </figure>)};

const Ruta=({p,abrirActor})=>(
  <section className="route-section wrap reveal" id={p.id+'-ruta'}>
    <div className="section-heading">
      <h2>La ruta crítica.<br/><em>Sólo lo más conectado.</em></h2>
      <p>Se conservan tres eslabones: el factor de mayor grado, la problemática central y el efecto de mayor grado. Alrededor, el círculo exterior de stakeholders. El mapa PESTEL completo queda como borrador de trabajo.</p>
    </div>
    <MapaRuta p={p} abrirActor={abrirActor}/>
    <div className="route-legend">
      {ROLE_ORDER.map(c=><span key={c} style={{'--role':ROLE[c].light,'--role-bright':ROLE[c].color}}><i></i>{ROLE[c].name}</span>)}
      <span className="route-rule">Quien causa y quien combate se conectan a la causa crítica; quien la vive, al efecto crítico.</span>
    </div>
    <div className="route-read"><p>{p.mapInsight}</p>
      <p className="metadata">La ruta se calcula por número de conexiones declaradas, con desempate por respaldo documental y por número de dimensiones que toca. No es una jerarquía causal medida.</p></div>
  </section>);

const Fondo=({p,...h})=>(
  <article className="chapter deep-dive" id={p.id+'-fondo'}
    style={{'--chapter':p.color,'--chapter-bg':p.bg,'--chapter-ink':p.ink,'--dark-bg':p.mapBg,'--dark-ink':p.mapAccent}}>
    <header className="chapter-nav">
      <a className="chapter-name" href={'#'+p.id+'-fondo'}><span className="num">{p.n}</span>{p.name} · a fondo</a>
      <nav aria-label="Secciones del mapa">
        <a href={'#'+p.id+'-mapa'}>Mapa PESTEL</a><a href={'#'+p.id+'-conexiones'}>Conexiones</a><a href={'#'+p.id+'-ruta'}>Ruta crítica</a>
      </nav>
    </header>
    <SeccionMapa p={p} abrirNodo={h.abrirNodo} abrirRelacion={h.abrirRelacion} abrirMetodo={h.abrirMetodo}/>
    <Conexiones p={p} abrirNodo={h.abrirNodo} abrirRelacion={h.abrirRelacion}/>
    <Ruta p={p} abrirActor={h.abrirActor}/>
  </article>);

/* ── Fuentes ──────────────────────────────────────────────────────────────── */
const Fuentes=({abrirFuente})=>{
  const [filtro,setFiltro]=useState('all');
  const ids=filtro==='all'?Object.keys(SOURCES):(()=>{const p=PROBLEMS.find(x=>x.id===filtro);
    return [...new Set([p.metricSource,...p.nodes.map(n=>n.source),...p.roles.flatMap(r=>r.sources)])]})();
  return(
  <section className="evidence-section wrap" id="fuentes">
    <div className="eyebrow">La evidencia detrás de la síntesis</div>
    <h2>Cada dato tiene<br/>un punto de partida.</h2>
    <div className="reference-tabs" role="group" aria-label="Filtrar fuentes">
      <button aria-pressed={filtro==='all'} onClick={()=>setFiltro('all')}>Todas</button>
      {PROBLEMS.map(p=><button key={p.id} aria-pressed={filtro===p.id} onClick={()=>setFiltro(p.id)}>{p.short}</button>)}
    </div>
    <div className="source-list">
      {ids.map(id=>{const s=SOURCES[id];return(
        <button className="source-row" key={id} onClick={()=>abrirFuente(id)}>
          <strong>{String(Object.keys(SOURCES).indexOf(id)+1).padStart(2,'0')}</strong>
          <div><h3>{s.name}</h3><p>{s.year} · {s.scope}</p></div><span className="arrow">↗</span>
        </button>)})}
    </div>
    <p className="source-note">Los datos conservan su año y población. Los mapas amplían la investigación con fuentes institucionales; cada vínculo distingue el respaldo documental de la interpretación del equipo.</p>
  </section>)};

/* ── App ──────────────────────────────────────────────────────────────────── */
const ANCLAS=[['inicio','Introducción'],...PROBLEMS.map(p=>[p.id,p.short]),
  [ELEGIDA+'-fondo','El mapa'],['fuentes','Fuentes']];

function App(){
  const [dialogo,setDialogo]=useState(null);
  const [oscuro,setOscuro]=useState(()=>{
    // Si el visor ya marcó un tema en el documento, se respeta; luego la preferencia guardada.
    const marca=document.documentElement.dataset.theme;
    if(marca==='dark')return true; if(marca==='light')return false;
    try{const t=localStorage.getItem('expediente-definitivo-theme');if(t)return t==='dark'}catch(e){}
    return matchMedia('(prefers-color-scheme:dark)').matches});
  const [activo,setActivo]=useState('inicio');
  const barra=useRef(null);
  const elegida=PROBLEMS.find(p=>p.id===ELEGIDA);

  useEffect(()=>{document.documentElement.dataset.theme=oscuro?'dark':'light';
    try{localStorage.setItem('expediente-definitivo-theme',oscuro?'dark':'light')}catch(e){}},[oscuro]);

  const cerrar=useCallback(()=>setDialogo(null),[]);
  const abrirFuente=id=>{const s=SOURCES[id];setDialogo({titulo:'Evidencia y contexto',cuerpo:(
    <React.Fragment><div className="eyebrow">Fuente de investigación</div><h2>{s.title}</h2><FichaFuente id={id}/></React.Fragment>)})};
  const abrirNodo=(p,id)=>{const n=p.nodes.find(x=>x.id===id);setDialogo({titulo:'Evidencia y contexto',cuerpo:(
    <React.Fragment><div className="eyebrow">{DIM[n.dim].name} · {kindName(n.kind)}</div>
      <h2>{plain(n.label)}</h2><p>{n.detail}</p><FichaFuente id={n.source}/></React.Fragment>)})};
  const abrirActor=(p,i)=>{const r=p.roles[i];setDialogo({titulo:'Evidencia y contexto',cuerpo:(
    <React.Fragment><div className="eyebrow">Stakeholder</div><h2>{r.name}</h2>
      <div className="role-chips">
        <span className="role-chip" style={{'--role':ROLE[r.cat].light,'--role-bright':ROLE[r.cat].color}}>{ROLE[r.cat].name}</span></div>
      <p>{r.porQue}</p>{r.nota&&<p className="metadata">{r.nota}</p>}
      {r.sources.map(id=><FichaFuente key={id} id={id}/>)}</React.Fragment>)})};
  const abrirRelacion=(p,i)=>{const r=p.relations[i],a=p.nodes.find(n=>n.id===r.a),b=p.nodes.find(n=>n.id===r.b);
    setDialogo({titulo:'Una relación de la red',cuerpo:(
    <React.Fragment><div className="eyebrow">{r.status}</div>
      <h2>{plain(a.label)}<br/>↔ {plain(b.label)}</h2><p>{r.why}</p>
      {r.source?<FichaFuente id={r.source}/>:(<React.Fragment>
        <p className="metadata">Interpretación del equipo apoyada en la evidencia de los nodos; no es un efecto causal estimado.</p>
        {[...new Set([a.source,b.source])].map(id=><FichaFuente key={id} id={id}/>)}</React.Fragment>)}
    </React.Fragment>)})};
  const abrirMetodo=p=>setDialogo({titulo:'Método y alcance',cuerpo:(
    <React.Fragment><div className="eyebrow">Político · Económico · Sociocultural · Tecnológico · Ecológico · Legal</div>
      <h2>PESTEL organiza.<br/>La evidencia respalda.</h2>
      <p>El mapa contiene {p.factorCount} factores, {p.effectCount} efectos y {p.nodes.length-p.factorCount-p.effectCount} elementos de contexto. Las barras cuentan únicamente factores, clasificados una sola vez según su dimensión principal.</p>
      <p>{p.gap}</p>
      <p>Más nodos significa mayor representación en esta selección, no mayor impacto causal. El resultado depende del recorte, la clasificación y el nivel de detalle. Un cero significa falta de evidencia incorporada, no ausencia del fenómeno.</p>
      <p className="metadata">Los vínculos documentales recuperan relaciones descritas por una fuente. Los demás son interpretaciones explícitas del equipo.</p>
      <FichaFuente id="pestel"/></React.Fragment>)});
  const abrirIndice=()=>setDialogo({titulo:'Índice',cuerpo:(
    <React.Fragment><h2>El recorrido.</h2><div className="contents-list">
      <a href="#inicio">Introducción</a>
      {PROBLEMS.map(p=><a key={p.id} href={'#'+p.id}>{p.n} · {p.name}</a>)}
      <a href={'#'+ELEGIDA+'-fondo'}>El mapa a fondo</a>
      <a href={'#'+ELEGIDA+'-mapa'}>↳ Mapa PESTEL</a>
      <a href={'#'+ELEGIDA+'-conexiones'}>↳ Conexiones</a>
      <a href={'#'+ELEGIDA+'-ruta'}>↳ Ruta crítica</a>
      <a href="#fuentes">Fuentes y método</a>
    </div></React.Fragment>)});

  useEffect(()=>{
    const obs=new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add('entered');obs.unobserve(e.target)}}),{threshold:.1});
    document.querySelectorAll('.reveal').forEach(e=>obs.observe(e));
    let tick=false;
    const scroll=()=>{const y=scrollY+180;let id='inicio';
      for(const [a] of ANCLAS){const e=document.getElementById(a);if(e&&e.offsetTop<=y)id=a}
      setActivo(id);
      const total=document.documentElement.scrollHeight-innerHeight;
      if(barra.current)barra.current.style.width=(total?scrollY/total*100:0)+'%';
      tick=false};
    const onScroll=()=>{if(!tick){tick=true;requestAnimationFrame(scroll)}};
    addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);
    scroll();
    return()=>{obs.disconnect();removeEventListener('scroll',onScroll);removeEventListener('resize',onScroll)}},[]);

  useEffect(()=>{if(!location.hash)return;
    requestAnimationFrame(()=>{const e=document.getElementById(location.hash.slice(1));
      if(e)e.scrollIntoView({behavior:'instant'})})},[]);

  const manejadores={abrirNodo,abrirRelacion,abrirMetodo,abrirActor};
  return(
    <React.Fragment>
      <a className="sr-only" href="#inicio">Saltar al contenido</a>
      <header className="topbar">
        <a className="brand" href="#inicio"><i aria-hidden="true"></i>EXPEDIENTE / 02</a>
        <nav className="global-nav" aria-label="Capítulos">
          {ANCLAS.map(([id,t])=><a key={id} href={'#'+id} aria-current={activo===id}>{t}</a>)}
        </nav>
        <div className="tools">
          <button className="tool" onClick={abrirIndice} aria-label="Abrir índice"><Icon name="index"/></button>
          <button className="tool" onClick={()=>setOscuro(o=>!o)} aria-label={oscuro?'Activar tema claro':'Activar tema oscuro'}><Icon name="theme"/></button>
        </div>
        <div className="page-progress" ref={barra}></div>
      </header>
      <main>
        <Portada abrirFuente={abrirFuente}/>
        {PROBLEMS.map(p=><Capitulo key={p.id} p={p} abrirNodo={abrirNodo} abrirFuente={abrirFuente} abrirActor={abrirActor}/>)}
        <Fondo p={elegida} {...manejadores}/>
        <Fuentes abrirFuente={abrirFuente}/>
      </main>
      <Dialogo dato={dialogo} cerrar={cerrar}/>
    </React.Fragment>)}

ReactDOM.createRoot(document.getElementById('raiz')).render(<App/>);
</script>
</body></html>
